<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 분석실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f3ef; --surface:#fcfcfb; --surface-2:#f0efea; --line:#e3e1da; --line-strong:#cfccc2;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#7d7b74;
  --series-1:#2a78d6; --series-2:#eb6834; --seq-weak:#cde2fb;
  --accent:#1f2a44; --good:#0f7a3d; --bad:#c2362f;
  --radius:10px; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#111110; --surface:#1a1a19; --surface-2:#232321; --line:#2e2e2b; --line-strong:#3d3d39;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e86;
    --series-1:#3987e5; --series-2:#d95926; --seq-weak:#1c3557;
    --accent:#e6e4dc; --good:#3fbf74; --bad:#ef6b63;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111110; --surface:#1a1a19; --surface-2:#232321; --line:#2e2e2b; --line-strong:#3d3d39;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e86;
  --series-1:#3987e5; --series-2:#d95926; --seq-weak:#1c3557;
  --accent:#e6e4dc; --good:#3fbf74; --bad:#ef6b63;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--series-1)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--text-3);font-size:11.5px;margin-top:-2px}
.nav-label{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.06em;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:7px;color:var(--text-2);text-decoration:none;font-size:13.5px}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--surface-2);color:var(--text);font-weight:600;box-shadow:inset 2px 0 0 var(--series-1)}
.nav a .cnt{font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.nav a .tag{font-size:10.5px;color:var(--text-3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
main{padding:22px 28px 60px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.topbar h1{font-size:21px;margin:0;letter-spacing:-.02em;flex:1;min-width:200px}
.topbar h1 small{display:block;font-size:12.5px;font-weight:400;color:var(--text-3);letter-spacing:0;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--text-2);font-size:13px}
.seg button.on{background:var(--surface-2);color:var(--text);font-weight:600}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);cursor:pointer}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.pill.live i{background:var(--good)}
.pill.err i{background:var(--bad)}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:11px 14px;margin-bottom:16px;font-size:13px;color:var(--text-2);display:flex;gap:10px;align-items:flex-start}
.banner b{color:var(--text)}
.banner.err{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}

/* ---------- cards ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--text-2)}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;margin-top:4px;line-height:1.15}
.kpi .v small{font-size:14px;color:var(--text-2);margin-left:2px}
.kpi .d{font-size:12px;color:var(--text-3);margin-top:4px}
.kpi .d .up{color:var(--good)} .kpi .d .down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;min-width:0}
.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.card-h h2{font-size:14.5px;margin:0;flex:1}
.card-h p{margin:2px 0 0;font-size:12.5px;color:var(--text-3);font-weight:400}
.card-h .tbl-toggle{font-size:12px;border:0;background:none;color:var(--text-3);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin:-4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.empty{color:var(--text-3);font-size:13px;padding:28px 0;text-align:center}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--text-3);font-size:12px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--text)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td.num{font-size:12.5px}
td.l{text-align:left}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.gname{font-weight:600} .gname small{display:block;font-weight:400;color:var(--text-3);font-size:11.5px}
.drop-tag{display:inline-block;max-width:170px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;color:var(--text-2)}

/* ---------- charts ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis text{fill:var(--text-3);font-size:11px;font-family:var(--mono)}
.tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.12);min-width:130px;opacity:0;transition:opacity .08s}
.tip.show{opacity:1}
.tip .t{color:var(--text-3);margin-bottom:4px;font-size:11.5px}
.tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between}
.tip .r span{display:inline-flex;align-items:center;gap:6px;color:var(--text-2)}
.tip .r i{width:8px;height:8px;border-radius:2px}
.tip .r b{font-family:var(--mono);font-weight:500}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:2px}
.f-row{display:grid;grid-template-columns:minmax(110px,200px) 1fr 92px 108px;gap:12px;align-items:center;padding:5px 4px;border-radius:6px}
.f-row:hover{background:var(--surface-2)}
.f-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-name small{color:var(--text-3);font-family:var(--mono);margin-right:6px;font-size:11px}
.f-track{height:18px;position:relative}
.f-bar{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.f-num{font-family:var(--mono);font-size:12.5px;text-align:right}
.f-num small{color:var(--text-3);margin-left:4px}
.f-drop{font-family:var(--mono);font-size:12.5px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:7px}
.f-drop .mini{height:8px;background:var(--series-2);border-radius:0 3px 3px 0;min-width:1px}
.f-drop.done{color:var(--good)}
.f-head{display:grid;grid-template-columns:minmax(110px,200px) 1fr 92px 108px;gap:12px;font-size:11.5px;color:var(--text-3);padding:0 4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.f-head span:nth-child(n+3){text-align:right}
.insight{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--text-2)}
.insight b{color:var(--text)}

/* ---------- guide ---------- */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 16px 56px;position:relative}
.step:before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:15px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-weight:600;font-size:13px;font-family:var(--mono)}
.step h3{margin:0 0 6px;font-size:14.5px}
.step p,.step li{color:var(--text-2);font-size:13px;margin:4px 0}
.step ul{padding-left:18px;margin:6px 0}
pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.55;margin:8px 0;position:relative;white-space:pre}
.copy{position:absolute;right:6px;top:6px;font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-family:var(--sans)}
code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.gcard h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gcard .meta{font-size:12px;color:var(--text-3);margin:2px 0 8px}
.ms-table td,.ms-table th{text-align:left;font-size:12.5px;white-space:normal}
.ms-table td:first-child{font-family:var(--mono);width:50px}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(460px,100%);padding:20px 22px;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:17px}
.modal p{color:var(--text-2);font-size:13px;margin:0 0 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:4px}
.field input{width:100%;border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13.5px}
.field input:focus{outline:2px solid var(--series-1);outline-offset:-1px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.msg{font-size:12.5px;margin-top:6px;min-height:18px}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.hr{height:1px;background:var(--line);margin:14px 0}

/* ---------- players ---------- */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 16px}
.subtabs a{padding:8px 14px;font-size:13.5px;color:var(--text-2);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs a.on{color:var(--text);font-weight:600;border-bottom-color:var(--series-1)}
.subtabs a .cnt{font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-left:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px}
.filters input{width:170px;font-family:var(--mono)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--text-2)}
.chip.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.chip .n{font-family:var(--mono);margin-left:4px;opacity:.75}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%}
.st.done i{background:var(--good)} .st.active i{background:var(--series-1)} .st.idle i{background:var(--text-3)} .st.gone i{background:var(--series-2)}
.pid{font-family:var(--mono);font-size:12.5px;color:var(--series-1);text-decoration:none}
.pid:hover{text-decoration:underline}
.journey{display:flex;gap:2px;height:14px;align-items:stretch;min-width:240px}
.journey span{background:var(--series-1);min-width:2px;border-radius:1px}
.journey span:nth-child(even){opacity:.62}
.journey span.exit{background:var(--series-2);opacity:1;border-radius:0 4px 4px 0}
.journey span.live{background:repeating-linear-gradient(135deg,var(--series-1) 0 3px,transparent 3px 6px);opacity:1;border:1px solid var(--series-1);border-radius:0 4px 4px 0}
.journey span.fin{background:var(--good);opacity:1;border-radius:0 4px 4px 0}
.j-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:10px}
.j-legend span{display:inline-flex;align-items:center;gap:6px}
.j-legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.seg-row{display:grid;grid-template-columns:minmax(120px,210px) 1fr 120px;gap:12px;align-items:center;padding:6px 4px;border-radius:6px}
.seg-row:hover{background:var(--surface-2)}
.seg-row .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg-row .nm small{display:block;color:var(--text-3);font-size:11.5px}
.seg-track{position:relative;height:16px}
.seg-bar{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.seg-bar.exit{background:var(--series-2)}
.seg-bar.live{background:repeating-linear-gradient(135deg,var(--series-1) 0 3px,transparent 3px 6px);border:1px solid var(--series-1)}
.seg-med{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55;border-radius:1px}
.seg-val{font-family:var(--mono);font-size:12.5px;text-align:right}
.seg-val small{display:block;color:var(--text-3);font-family:var(--sans);font-size:11px}
.sess{border-top:1px solid var(--line);padding:12px 2px}
.sess:first-child{border-top:0}
.sess-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.sess-h b{font-family:var(--mono);font-weight:500}
.sess-h span{color:var(--text-3);font-size:12px}
.sess-bar{position:relative;height:12px;background:var(--surface-2);border-radius:3px;margin:8px 0 6px}
.sess-fill{position:absolute;left:0;top:0;bottom:0;background:var(--seq-weak);border-radius:3px}
.sess-tick{position:absolute;top:-3px;width:8px;height:18px;margin-left:-4px;border-radius:2px;background:var(--series-1);border:2px solid var(--surface);cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--surface)}
.mchip b{font-weight:500}
.mchip small{font-family:var(--mono);color:var(--text-3);margin-left:4px}
.gap{font-size:11.5px;color:var(--text-3);text-align:center;padding:2px 0;position:relative}
.back{font-size:13px;color:var(--text-2);text-decoration:none;display:inline-block;margin-bottom:10px}
.back:hover{color:var(--text)}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--text-3)}
.tmx td.cell{padding:4px;text-align:center}
.tmx .c{display:block;border-radius:5px;padding:5px 2px;font-family:var(--mono);font-size:11.5px;min-width:54px;color:var(--text)}
.tmx .c.z{color:var(--text-3)}
.tmx th.g{font-size:11px;white-space:normal;line-height:1.25;text-align:center;min-width:64px;max-width:90px}
.tmx td.nm{min-width:150px}
.tmx td.nm input{all:unset;font-weight:600;font-size:13px;width:100%;border-bottom:1px dashed transparent;cursor:text}
.tmx td.nm input:hover,.tmx td.nm input:focus{border-bottom-color:var(--line-strong)}
.tmx td.nm small{display:block;color:var(--text-3);font-size:11px}
.code{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;cursor:pointer;border:1px dashed transparent;border-radius:4px;padding:1px 4px}
.code:hover{border-color:var(--line-strong)}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:11.5px;cursor:pointer;color:var(--text-2)}
.tbtn.off{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.seq-legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.seq-legend .ramp{display:flex;gap:2px}.seq-legend .ramp i{width:22px;height:10px;border-radius:2px}
textarea.add{width:100%;min-height:96px;border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:8px 10px;font:13px var(--sans);resize:vertical}
.tag-t{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--text-2);margin-left:6px;text-decoration:none}
.menu-btn{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:16px 14px 50px}
  .grid2{grid-template-columns:1fr}
  .f-row,.f-head{grid-template-columns:96px 1fr 70px 84px;gap:8px}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></div>
      <div><b>게임 분석실</b><small>방문 · 체류 · 이탈</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main>
    <div class="topbar">
      <button class="btn menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
      <h1 id="title">전체 개요<small></small></h1>
      <div class="seg" id="range" role="group" aria-label="기간">
        <button data-d="7">7일</button><button data-d="14" class="on">14일</button><button data-d="30">30일</button><button data-d="90">90일</button>
      </div>
      <button class="pill" id="connPill" title="DB 연결 설정"><i></i><span>데모 데이터</span></button>
    </div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>

<div class="tip" id="tip"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-labelledby="mTitle">
    <h2 id="mTitle">DB 연결</h2>

/* =====================================================================
   기간 (한국 시간 자정 기준)
   ===================================================================== */
const DAY = 86400000, KST = 9 * 3600000;
function kstMidnight(t) { return Math.floor((t + KST) / DAY) * DAY - KST; }
function range(days, shift = 0) {
  const end = kstMidnight(Date.now()) + DAY - shift * days * DAY;
  return { from: end - days * DAY, to: end };
}
function dayKey(t) { return new Date(t + KST).toISOString().slice(0, 10); }

/* =====================================================================
   LIVE API (Supabase REST, 라이브러리 없이 fetch)
   ===================================================================== */
const Live = {
  async login(url, key, email, password) {
    const r = await fetch(url + '/auth/v1/token?grant_type=password', {
      method:'POST', headers:{ apikey:key, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || ('로그인 실패 (' + r.status + ')'));
    return { access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now() + (j.expires_in || 3600) * 1000, email };
  },
  async refresh() {
    const { url, key } = state.cfg;
    const r = await fetch(url + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{ apikey:key, 'Content-Type':'application/json' },
      body: JSON.stringify({ refresh_token: state.auth.refresh_token })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { state.auth = null; LS.del('ga_auth'); throw new Error('로그인이 만료되었습니다. 다시 로그인하세요.'); }
    state.auth = { ...state.auth, access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now() + (j.expires_in || 3600) * 1000 };
    LS.set('ga_auth', state.auth);
  },
  async req(path, opts = {}) {
    if (!state.auth) throw new Error('로그인이 필요합니다.');
    if (Date.now() > state.auth.expires_at - 60000) await Live.refresh();
    const { url, key } = state.cfg;
    const r = await fetch(url + path, { ...opts, headers:{ apikey:key, Authorization:'Bearer ' + state.auth.access_token, 'Content-Type':'application/json', Prefer:'return=representation', ...(opts.headers || {}) } });
    if (!r.ok) {
      const t = await r.text();
      let m = t; try { m = JSON.parse(t).message || t; } catch (e) {}
      throw new Error(r.status + ' ' + m);
    }
    return r.json();
  },
  rpc(fn, args) { return Live.req('/rest/v1/rpc/' + fn, { method:'POST', body: JSON.stringify(args) }); },
  iso: t => new Date(t).toISOString(),
  overview: (r) => Live.rpc('analytics_overview', { p_from:Live.iso(r.from), p_to:Live.iso(r.to) }),

/* 테스터 코드: 헷갈리는 글자(0 O 1 I L) 없이 8자리 → XXXX-XXXX */
const CODE_ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function makeCode(rand) {
  let c = '';
  if (!rand && window.crypto && crypto.getRandomValues) { const a = new Uint32Array(8); crypto.getRandomValues(a); a.forEach(x => c += CODE_ABC[x % CODE_ABC.length]); }
  else for (let i = 0; i < 8; i++) c += CODE_ABC[Math.floor((rand || Math.random)() * CODE_ABC.length)];
  return c.slice(0, 4) + '-' + c.slice(4);
}

/* =====================================================================
   DEMO 데이터 : 실제 DB 와 같은 규칙으로 계산 (schema.sql 의 함수와 동일)
   ===================================================================== */
const Demo = (() => {
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const R = mulberry(20261119);
  const gauss = () => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const PROFILE = {
    waiting:              { n:540, dwell:6.5, cont:.80, wall:1, per:2 },
    flip_it_all:          { n:430, dwell:5.0, cont:.86, wall:7, per:5 },
    seller_of_the_border: { n:310, dwell:9.0, cont:.84, wall:3, per:3 },
    disaster_hero:        { n:120, dwell:11,  cont:.78, wall:3, per:2 },
    highrise_cleaner:     { n:90,  dwell:4.0, cont:.70, wall:1, per:2 },
    jurassic_brawl:       { n:380, dwell:8.0, cont:.82, wall:2, per:3 },
    my_pet_hero:          { n:460, dwell:12,  cont:.88, wall:4, per:3 },
    planet_battle:        { n:270, dwell:7.0, cont:.76, wall:2, per:2 },
  };
  const now = Date.now();
  const sessions = [], reaches = [];
  let sid = 0;
  for (const g of GAMES) {
    const P = PROFILE[g.id], ms = g.ms.map(m => ({ step:m[0], name:m[1] }));
    for (let v = 0; v < P.n; v++) {
      const vid = g.id + ':' + v;
      let t = now - Math.pow(R(), 1.5) * 90 * DAY;
      const evening = (19 + Math.floor(R() * 5)) % 24;
      t = kstMidnight(t) + (R() < .6 ? evening : Math.floor(R() * 24)) * 3600000 + R() * 3600000;
      let nS = 1; while (R() < .5 && nS < 14) nS++;
      let idx = 0, total = 0;
      const device = R() < .58 ? 'mobile' : (R() < .9 ? 'desktop' : 'tablet');
      for (let s = 0; s < nS && t < now; s++) {
        const bounce = s === 0 && R() < .18;
        const dwell = bounce ? 4000 + R() * 40000 : Math.max(20000, Math.exp(Math.log(P.dwell * 60000) + gauss() * .75));
        let k = 0;
        if (!bounce) while (idx + k < ms.length && k < P.per) {
          let p = P.cont; if (idx + k === P.wall) p *= .55;
          if (R() > p) break; k++;
        }
        const id = 's' + (++sid);
        let last = null, maxStep = null;
        for (let j = 0; j < k; j++) {
          const m = ms[idx + j];
          reaches.push({ game:g.id, vid, sid:id, step:m.step, name:m.name, total: total + dwell * (j + 1) / (k + 1), el: dwell * (j + 1) / (k + 1), t });
          last = m.name; maxStep = m.step;
        }
        sessions.push({ game:g.id, vid, sid:id, t, dwell, last, maxStep, device, startTotal: total });
        idx += k; total += dwell;
        if (idx >= ms.length && R() < .7) break;
        t += (R() < .5 ? R() * DAY : R() * 9 * DAY) + 600000;
      }
    }
  }
  const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length / 2; return s.length % 2 ? s[m | 0] : (s[m - 1] + s[m]) / 2; };
  const inR = (s, r) => s.t >= r.from && s.t < r.to;
  const round1 = x => Math.round(x * 10) / 10;
  const firstSeen = {};
  for (const s of sessions) { const k = s.game + '|' + s.vid; if (!(k in firstSeen) || s.t < firstSeen[k]) firstSeen[k] = s.t; }

  function overview(r) {
    const out = [];
    for (const g of GAMES) {
      const ss = sessions.filter(s => s.game === g.id && inR(s, r));
      if (!ss.length) continue;
      const per = {}; ss.forEach(s => per[s.vid] = (per[s.vid] || 0) + 1);
      const vids = Object.keys(per);
      const best = {}; ss.forEach(s => { const b = best[s.vid]; if (!b || (s.maxStep ?? -1) > (b.maxStep ?? -1) || ((s.maxStep ?? -1) === (b.maxStep ?? -1) && s.t > b.t)) best[s.vid] = s; });
      const dc = {}; Object.values(best).forEach(b => { const k = b.last || '(마일스톤 전 이탈)'; dc[k] = (dc[k] || 0) + 1; });
      const top = Object.entries(dc).sort((a, b) => b[1] - a[1])[0];
      out.push({
        game_id:g.id, visitors:vids.length, sessions:ss.length,
        returning_visitors: vids.filter(v => per[v] >= 2).length,
        new_visitors: vids.filter(v => { const f = firstSeen[g.id + '|' + v]; return f >= r.from && f < r.to; }).length,
        avg_dwell_sec: round1(ss.reduce((a, s) => a + s.dwell, 0) / ss.length / 1000),
        median_dwell_sec: round1(median(ss.map(s => s.dwell)) / 1000),
        total_play_hours: Math.round(ss.reduce((a, s) => a + s.dwell, 0) / 36000) / 100,
        top_drop_milestone: top ? top[0] : null,
      });
    }
    return out.sort((a, b) => b.visitors - a.visitors);
  }
  function daily(g, r) {
    const m = {};
    sessions.filter(s => (!g || s.game === g) && inR(s, r)).forEach(s => {
      const k = dayKey(s.t); (m[k] = m[k] || { v:new Set(), n:0, d:0 }); m[k].v.add(s.vid); m[k].n++; m[k].d += s.dwell;
    });
    return Object.keys(m).sort().map(k => ({ day:k, visitors:m[k].v.size, sessions:m[k].n, avg_dwell_sec:round1(m[k].d / m[k].n / 1000) }));
  }
  function funnel(g, r) {
    const ss = sessions.filter(s => s.game === g && inR(s, r));
    const sids = new Set(ss.map(s => s.sid)), vids = new Set(ss.map(s => s.vid));
    const rs = reaches.filter(x => x.game === g && sids.has(x.sid));
    const maxS = {}; rs.forEach(x => { maxS[x.vid] = Math.max(maxS[x.vid] ?? -1, x.step); });
    const steps = [...new Set(rs.map(x => x.step))].sort((a, b) => a - b);
    const rows = [{ step:0, milestone:'접속', visitors_reached:vids.size, visitors_dropped:[...vids].filter(v => !(v in maxS)).length, median_total_min:null }];
    for (const st of steps) {

const fmtN = n => n == null ? '–' : Number(n).toLocaleString('ko-KR');
function fmtDur(sec, short) {

  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;

const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
function fmtTime(iso) {
  const d = new Date(new Date(iso).getTime() + KST);
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;
}
function delta(cur, prev, invert) {

  const d = (cur - prev) / prev * 100, up = d >= 0;
  return `<span class="${(up !== !!invert) ? 'up' : 'down'}">${up ? '▲' : '▼'} ${Math.abs(d).toFixed(1)}%</span> 이전 ${state.days}일 대비`;

const hideTip = () => tip.classList.remove('show');

function lineChart(el, labels, series, opt = {}) {
  const W = el.clientWidth || 600, H = opt.h || 220, L = 40, Rr = 12, T = 10, B = 26;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.values)));
  const x = i => L + (labels.length <= 1 ? (W - L - Rr) / 2 : i * (W - L - Rr) / (labels.length - 1));
  const y = v => T + (H - T - B) * (1 - v / max);
  const ticks = (max % 5 === 0 ? [0, .2, .4, .6, .8, 1] : [0, .25, .5, .75, 1]).map(f => f * max);
  const every = Math.ceil(labels.length / Math.max(2, Math.floor((W - L) / 64)));

  s += `<g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - Rr}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>`;
  s += `<g class="axis">${ticks.map(t => `<text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmtN(Math.round(t))}</text>`).join('')}`;

  try { const r = await fn(); state.liveError = null; return r; }
  catch (e) {
    let m = e.message || String(e);
    if (e instanceof TypeError) m = '서버에 닿지 못했습니다. 주소를 확인하세요. (claude.ai 미리보기 창 안에서는 외부 DB 연결이 막혀 있어, GitHub Pages 에 올린 대시보드에서 연결해야 합니다.)';
    state.liveError = m; renderConn(); throw e;
  }
}

async function viewOverview() {

      <div class="kpi"><div class="l">총 플레이 시간</div><div class="v">${fmtN(Math.round(H))}<small>시간</small></div><div class="d">${delta(H, pH)}</div></div>

    <section class="card"><div class="card-h"><div style="flex:1"><h2>게임별 비교</h2><p>행을 누르면 그 게임의 상세 분석으로 갑니다. 열 제목을 누르면 정렬됩니다.</p></div></div><div id="ovTable"></div></section>
    ${card('cTrend', '전체 일별 방문자', '모든 게임 합계 · 한 사람이 여러 게임을 하면 게임마다 따로 셉니다')}

    return { g, o, rr: pct(o.returning_visitors, o.visitors), spv: o.visitors ? Math.round(o.sessions / o.visitors * 10) / 10 : 0 };
  });
  let sortKey = 'visitors', dir = -1;
  const COLS = [['게임', null], ['방문자', 'visitors'], ['신규', 'new_visitors'], ['접속', 'sessions'], ['1인당 접속', 'spv'], ['재방문율', 'rr'], ['평균 체류', 'avg_dwell_sec'], ['중앙 체류', 'median_dwell_sec'], ['총 플레이', 'total_play_hours'], ['가장 많이 멈춘 곳', null]];
  const val = (x, k) => k in x ? x[k] : Number(x.o[k] ?? -1);
  function draw() {
    rows.sort((a, b) => (val(a, sortKey) - val(b, sortKey)) * dir);
    $('#ovTable').innerHTML = `<div class="tbl-wrap"><table><thead><tr>${COLS.map(c => `<th class="${c[1] ? 'sortable' : ''}" data-k="${c[1] || ''}">${c[0]}${c[1] === sortKey ? (dir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('')}</tr></thead><tbody>${
      rows.map(({ g, o, rr, spv }) => `<tr class="click" data-g="${slug(g.id)}">
        <td class="l"><div class="gname">${esc(g.name)}<small>${esc(g.engine)}${g.url ? '' : ' · 링크 없음'}</small></div></td>
        <td class="num">${fmtN(o.visitors)}</td><td class="num">${fmtN(o.new_visitors)}</td><td class="num">${fmtN(o.sessions)}</td>

        <td class="num">${fmtDur(o.avg_dwell_sec)}</td><td class="num">${fmtDur(o.median_dwell_sec)}</td>
        <td class="num">${o.total_play_hours ? fmtN(Math.round(o.total_play_hours * 10) / 10) + '시간' : '–'}</td>

    $('#ovTable').querySelectorAll('th.sortable').forEach(th => th.onclick = () => { const k = th.dataset.k; dir = k === sortKey ? -dir : -1; sortKey = k; draw(); });
    $('#ovTable').querySelectorAll('tr.click').forEach(tr => tr.onclick = () => location.hash = 'game-' + tr.dataset.g);
  }
  draw();

  lineChart(c.querySelector('.chart'), labels, [{ name:'방문자', color:css('--series-1'), values:vis }, { name:'접속', color:css('--series-2'), values:ses }], { label:'일별 방문자와 접속' });
  $('#cTrend .c-table').innerHTML = tableHTML(['날짜', '방문자', '접속'], labels.map((l, i) => [l, fmtN(vis[i]), fmtN(ses[i])]));
  wireToggles(view);
}

async function viewGame(id) {

  const r = range(state.days);
  setTitle(g.name, rangeLabel(r) + (g.url ? ` · <a href="${esc(g.url)}" target="_blank" rel="noopener">게임 열기 ↗</a>` : ' · 아직 공개 링크 없음'));
  view.innerHTML = '<div class="empty">불러오는 중…</div>';
  const [ovAll, daily, fun, dw, fq, list] = await Promise.all([
    load(() => api().overview(r)),
    load(() => api().daily(id, r)), load(() => api().funnel(id, r)), load(() => api().dwell(id, r)),
    load(() => api().freq(id, r)), load(() => api().sessions(id, r))]);
  state.overviewCache = ovAll; renderNav();
  const o = ovAll.find(x => x.game_id === id);
  if (!o) {
    view.innerHTML = `<div class="card"><div class="empty">이 기간에 기록된 접속이 없습니다.<br><br>${g.url ? '트래커를 아직 넣지 않았다면 <a href="#guide">설치 가이드</a>를 보세요.' : '게임을 웹에 올리고 트래커를 넣으면 여기에 나옵니다. <a href="#guide">설치 가이드</a>'}</div></div>`;
    return;
  }
  const last = fun.length > 1 ? fun[fun.length - 1] : null;
  const V = Number(o.visitors);
  const finalStep = g.final ?? Math.max(...g.ms.map(m => m[0]));
  const finished = !!last && Number(last.step) >= finalStep;

  view.innerHTML = subtabs(g, 'summary', V) + `
    <div class="kpis">
      <div class="kpi"><div class="l">방문자 (고유)</div><div class="v">${fmtN(V)}</div><div class="d">신규 ${fmtN(o.new_visitors)}명 · 접속 ${fmtN(o.sessions)}회</div></div>
      <div class="kpi"><div class="l">1인당 접속</div><div class="v">${(o.sessions / V).toFixed(1)}<small>회</small></div><div class="d">재방문 ${fmtN(o.returning_visitors)}명 (${pct(o.returning_visitors, V)}%)</div></div>
      <div class="kpi"><div class="l">평균 체류</div><div class="v">${fmtDur(o.avg_dwell_sec)}</div><div class="d">중앙값 ${fmtDur(o.median_dwell_sec)}</div></div>
      <div class="kpi"><div class="l">${!last ? '마일스톤' : finished ? '끝까지 간 사람' : '가장 멀리 간 지점'}</div><div class="v">${last ? pct(last.visitors_reached, V) + '<small>%</small>' : '–'}</div><div class="d">${last ? `${esc(last.milestone)} 도달 ${fmtN(last.visitors_reached)}명` : '아직 마일스톤 기록 없음'}</div></div>
    </div>
    ${card('cFunnel', '어디서 빠지나 · 마일스톤 퍼널', '도달 = 그 지점을 밟은 사람 수 · 여기서 멈춤 = 기간 중 마지막으로 도달한 지점이 여기인 사람 수', '', true)}
    ${card('cSeg', '구간별로 머문 시간', '구간 = 한 지점에 도착해서 다음 지점에 도착할 때까지 실제로 플레이한 시간 (여러 번 나눠 접속해도 이어서 계산)', '<div class="empty">불러오는 중…</div>', true)}
    <div class="grid2">
      ${card('cDwell', '체류시간 분포', '접속 1회당 실제로 화면을 보며 조작한 시간')}
      ${card('cFreq', '같은 사람이 몇 번 들어왔나', '기간 안 사람별 접속 횟수')}

    <section class="card"><div class="card-h"><div style="flex:1"><h2>최근 접속 기록</h2><p>최근 접속부터 · 방문자 ID는 브라우저마다 무작위로 만든 값이라 누구인지 알 수 없습니다</p></div></div><div id="sessTable"></div></section>
  `;

  // funnel
  const fc = $('#cFunnel .c-chart');

    fc.innerHTML = `<div class="empty">아직 마일스톤이 기록되지 않았습니다. 게임 코드에 <code>GameTracker.milestone('이름', 순서)</code>를 넣으면 여기에 단계별로 나옵니다. <a href="#guide">어디에 넣을지 보기</a></div>`;
  } else {
    const top = Number(fun[0].visitors_reached) || 1;
    const dropRows = finished ? fun.slice(0, -1) : fun;

    const minN = Math.max(10, top * .05);

    for (let i = 1; i < fun.length; i++) {
      const prevN = Number(fun[i - 1].visitors_reached), lost = prevN - Number(fun[i].visitors_reached), rate = prevN ? lost / prevN : 0;
      if (prevN >= minN && (!worst || rate > worst.rate)) worst = { from:fun[i - 1].milestone, to:fun[i].milestone, rate, lost };
    }
    const biggest = dropRows.reduce((a, f) => Number(f.visitors_dropped) > Number(a.visitors_dropped) ? f : a, dropRows[0]);

        return `<div class="f-row" data-i="${i}">
          <div class="f-name" title="${esc(f.milestone)}"><small>${f.step}</small>${esc(f.milestone)}</div>

          <div class="f-num">${fmtN(f.visitors_reached)}<small>${pct(f.visitors_reached, top)}%</small></div>
          ${isLast ? `<div class="f-drop done">완주 ${fmtN(dr)}</div>` : `<div class="f-drop">${fmtN(dr)}<span class="mini" style="width:${Math.max(1, dr / maxDrop * 40)}px"></span></div>`}
        </div>`; }).join('')}</div>
      <div class="insight">가장 많이 멈춘 곳은 <b>${esc(biggest.milestone)}</b> (${fmtN(biggest.visitors_dropped)}명, 전체의 ${pct(biggest.visitors_dropped, top)}%)입니다.
      ${worst && worst.rate > 0 ? ` 단계 사이 이탈률이 가장 큰 구간은 <b>${esc(worst.from)} → ${esc(worst.to)}</b>로, 앞 단계 도달자의 <b>${Math.round(worst.rate * 100)}%</b>가 다음 단계에 못 갔습니다.` : ''}</div>`;
    fc.querySelectorAll('.f-row').forEach(row => {
      const f = fun[+row.dataset.i], i = +row.dataset.i;
      row.onpointermove = e => showTip(e, f.milestone, [
        { c:css('--series-1'), l:'도달', v:fmtN(f.visitors_reached) + '명' },
        { l:'접속 대비', v:pct(f.visitors_reached, top) + '%' },
        ...(i ? [{ l:'앞 단계 대비', v:pct(f.visitors_reached, fun[i - 1].visitors_reached) + '%' }] : []),
        { c: finished && i === fun.length - 1 ? null : css('--series-2'), l: finished && i === fun.length - 1 ? '완주' : '여기서 멈춤', v:fmtN(f.visitors_dropped) + '명' },
        ...(f.median_total_min != null ? [{ l:'도달까지 누적 플레이(중앙)', v:f.median_total_min + '분' }] : [])]);
      row.onpointerleave = hideTip;
    });
    $('#cFunnel .c-table').innerHTML = tableHTML(['단계', '지점', '도달', '접속 대비', '여기서 멈춤', '도달까지 누적 플레이(중앙, 분)'],
      fun.map(f => [f.step, f.milestone, fmtN(f.visitors_reached), pct(f.visitors_reached, top) + '%', fmtN(f.visitors_dropped), f.median_total_min ?? '–'])).replace('<th>단계</th>', '<th style="text-align:left">단계</th>');
  }

  // dwell + freq
  columnChart($('#cDwell .c-chart'), dw.map(d => d.bucket), dw.map(d => Number(d.sessions)), { unit:'접속', label:'체류시간 분포', h:210, short:['~30초', '~1분', '~3분', '~5분', '~10분', '~20분', '~40분', '40분+'] });
  $('#cDwell .c-table').innerHTML = tableHTML(['체류시간', '접속'], dw.map(d => [d.bucket, fmtN(d.sessions)]));
  columnChart($('#cFreq .c-chart'), fq.map(d => d.bucket), fq.map(d => Number(d.visitors)), { unit:'사람', label:'방문 횟수 분포', h:210, short:['1회', '2회', '3–5', '6–10', '11+'] });
  $('#cFreq .c-table').innerHTML = tableHTML(['접속 횟수', '사람'], fq.map(d => [d.bucket, fmtN(d.visitors)]));

  // daily
  const labels = [], m = Object.fromEntries(daily.map(d => [String(d.day).slice(0, 10), d]));
  for (let t = r.from; t < r.to; t += DAY) labels.push(dayKey(t));
  const vis = labels.map(k => m[k] ? Number(m[k].visitors) : 0), ses = labels.map(k => m[k] ? Number(m[k].sessions) : 0), dwl = labels.map(k => m[k] ? Number(m[k].avg_dwell_sec) : 0);
  const dc = $('#cDaily .c-chart');
  dc.innerHTML = `<div class="legend"><span><i style="background:var(--series-1)"></i>방문자</span><span><i style="background:var(--series-2)"></i>접속</span></div><div class="chart"></div>`;
  lineChart(dc.querySelector('.chart'), labels, [{ name:'방문자', color:css('--series-1'), values:vis }, { name:'접속', color:css('--series-2'), values:ses }], { label:'일별 방문자와 접속' });
  $('#cDaily .c-table').innerHTML = tableHTML(['날짜', '방문자', '접속', '평균 체류'], labels.map((l, i) => [l, fmtN(vis[i]), fmtN(ses[i]), fmtDur(dwl[i])]));

  // sessions
  let shown = 20;
  const drawSess = () => { $('#sessTable').innerHTML = list.length ? `<div class="tbl-wrap"><table><thead><tr><th>시작</th><th>방문자</th><th style="text-align:left">테스터</th><th>몇 번째 방문</th><th>체류</th><th style="text-align:left">마지막 마일스톤</th><th>기기</th></tr></thead><tbody>${
    list.slice(0, shown).map(s => `<tr><td class="l num">${fmtTime(s.started_at)}</td><td class="num"><a class="pid" href="#player-${slug(g.id)}--${esc(s.visitor_id)}">${esc(String(s.visitor_id).slice(0, 6))}</a></td><td class="l">${s.tester_code ? `<a href="#tester-${esc(s.tester_code)}" style="color:inherit">${esc(s.tester_name || s.tester_code)}</a>` : '<span style="color:var(--text-3)">–</span>'}</td><td class="num">${s.visit_no}번째</td><td class="num">${fmtDur(s.dwell_sec)}</td><td class="l">${esc(s.last_milestone || '–')}</td><td>${({ mobile:'모바일', desktop:'PC', tablet:'태블릿' })[s.device] || '–'}</td></tr>`).join('')
  }</tbody></table></div>${shown < list.length ? `<div style="text-align:center;margin-top:12px"><button class="btn" id="moreSess">더 보기 (${list.length - shown}건)</button></div>` : ''}` : '<div class="empty">기록 없음</div>';
    const mb = $('#moreSess'); if (mb) mb.onclick = () => { shown += 40; drawSess(); }; };

  load(() => api().segments(id, r)).then(seg => renderSegments($('#cSeg'), seg, g)).catch(e => { const c = $('#cSeg .c-chart'); if (c) c.innerHTML = `<div class="empty">구간 분석을 불러오지 못했습니다. ${esc(e.message)}<br>Supabase 에 <code>supabase/players.sql</code> 이 실행됐는지 확인하세요.</div>`; });
}

  `;
  view.querySelectorAll('.copy').forEach(b => b.onclick = async () => {

/* =====================================================================
   플레이어 · 구간 분석
   ===================================================================== */
const ST = { done:'완주', active:'진행 중', idle:'휴면', gone:'이탈' };
const ST_HELP = { done:'마지막 지점까지 도달', active:'최근 3일 안에 플레이', idle:'3–14일째 안 들어옴', gone:'14일 넘게 안 들어옴' };
const finalOf = g => g.final ?? Math.max(...g.ms.map(m => m[0]));
function statusOf(p, g) {
  if (p.max_step != null && Number(p.max_step) >= finalOf(g)) return 'done';
  const d = (Date.now() - Date.parse(p.last_seen)) / DAY;
  return d <= 3 ? 'active' : d <= 14 ? 'idle' : 'gone';
}
const stHTML = k => `<span class="st ${k}" title="${ST_HELP[k]}"><i></i>${ST[k]}</span>`;
const short = id => String(id).slice(0, 6);
const segName = (sg, next) => next ? `${sg.name} → ${next.name}` : `${sg.name} 이후`;
function ago(iso) {
  const m = (Date.now() - Date.parse(iso)) / 60000;
  if (m < 60) return Math.max(1, Math.round(m)) + '분 전';
  if (m < 1440) return Math.round(m / 60) + '시간 전';
  return Math.round(m / 1440) + '일 전';
}
function gapText(ms) {
  const h = ms / 3600000;
  if (h < 1) return Math.max(1, Math.round(ms / 60000)) + '분 뒤';
  if (h < 24) return Math.round(h) + '시간 뒤';
  const d = Math.floor(h / 24), rh = Math.round(h - d * 24);
  return d + '일' + (rh ? ' ' + rh + '시간' : '') + ' 뒤';
}
function subtabs(g, on, n) {
  const sl = slug(g.id);
  return `<nav class="subtabs"><a href="#game-${sl}" class="${on === 'summary' ? 'on' : ''}">요약</a><a href="#players-${sl}" class="${on === 'players' ? 'on' : ''}">플레이어${n != null ? `<span class="cnt">${fmtN(n)}</span>` : ''}</a></nav>`;
}
// 마지막 구간 표시 방식: 완주 / 아직 진행 중 / 여기서 나감
function lastKind(st) { return st === 'done' ? 'fin' : st === 'active' ? 'live' : 'exit'; }

/* ---------- 구간 요약 (게임 요약 페이지 안) ---------- */
function renderSegments(cardEl, seg, g) {
  if (!cardEl) return;
  const c = cardEl.querySelector('.c-chart'), tb = cardEl.querySelector('.c-table');
  if (!seg.length) { c.innerHTML = '<div class="empty">아직 기록이 없습니다.</div>'; return; }
  const fin = finalOf(g);
  const rows = seg.map((sg, i) => ({ ...sg, next: seg[i + 1], isFinal: Number(sg.step) >= fin }));
  const real = rows.filter(r => !r.isFinal);
  const max = Math.max(...(real.length ? real : rows).map(r => Number(r.p90_sec || r.median_sec || 0)), 1);
  const longest = real.reduce((a, r) => Number(r.median_sec) > Number(a?.median_sec ?? -1) ? r : a, null);
  const leak = real.filter(r => r.entered >= 5).reduce((a, r) => (r.exited / r.entered) > (a ? a.exited / a.entered : -1) ? r : a, null);
  c.innerHTML = `<div class="j-legend"><span><i style="background:var(--series-1)"></i>중앙값 (절반이 이보다 짧게 머묾)</span><span><i style="background:var(--seq-weak)"></i>상위 10% (오래 머문 사람)</span><span><i style="background:var(--series-2)"></i>여기서 나간 사람</span></div>
    <div class="f-head" style="grid-template-columns:minmax(120px,210px) 1fr 92px 120px"><span>구간</span><span>머문 시간</span><span>들어옴 → 다음</span><span>여기서 나감</span></div>
    ${rows.map((r, i) => `<div class="f-row" data-i="${i}" style="grid-template-columns:minmax(120px,210px) 1fr 92px 120px">
      <div class="f-name" title="${esc(segName(r, r.next))}"><small>${r.step}</small>${esc(r.name)}${r.isFinal ? '' : ' →'}</div>
      <div class="f-track"><div class="f-bar" style="width:${Math.min(100, Number(r.p90_sec || 0) / max * 100)}%;background:var(--seq-weak)"></div><div class="f-bar" style="width:${Math.min(100, Number(r.median_sec || 0) / max * 100)}%${r.isFinal ? ';background:var(--good)' : ''}"></div></div>
      <div class="f-num">${fmtDur(r.median_sec)}<small>${fmtN(r.entered)}→${fmtN(r.moved_on)}</small></div>
      ${r.isFinal ? `<div class="f-drop done">완주 ${fmtN(r.entered)}</div>` : `<div class="f-drop">${fmtN(r.exited)}<small style="color:var(--text-3);margin-left:2px">${pct(r.exited, r.entered)}%</small><span class="mini" style="width:${Math.max(1, r.exited / Math.max(1, ...real.map(x => x.exited)) * 36)}px"></span></div>`}
    </div>`).join('')}
    <div class="insight">${longest ? `가장 오래 머무는 구간은 <b>${esc(segName(longest, longest.next))}</b> (중앙값 ${fmtDur(longest.median_sec)}).` : ''}
    ${leak ? ` 들어온 사람 대비 가장 많이 나가는 구간은 <b>${esc(segName(leak, leak.next))}</b>로 <b>${pct(leak.exited, leak.entered)}%</b>가 여기서 그만뒀고, 그 사람들은 나가기 전 중앙값 ${fmtDur(leak.median_exited_sec)} 머물렀습니다.` : ''}
    <a href="#players-${slug(g.id)}">플레이어별로 보기 →</a></div>`;
  c.querySelectorAll('.f-row').forEach(el => {
    const r = rows[+el.dataset.i];
    el.onpointermove = e => showTip(e, segName(r, r.next), [
      { c:css('--series-1'), l:'머문 시간 중앙값', v:fmtDur(r.median_sec) },
      { l:'평균', v:fmtDur(r.avg_sec) }, { l:'상위 10%', v:fmtDur(r.p90_sec) },
      ...(r.isFinal ? [] : [{ l:'다음으로 간 사람', v:fmtN(r.moved_on) + '명 · ' + fmtDur(r.median_moved_sec) }, { c:css('--series-2'), l:'여기서 나간 사람', v:fmtN(r.exited) + '명 · ' + fmtDur(r.median_exited_sec) }])]);
    el.onpointerleave = hideTip;
  });
  tb.innerHTML = tableHTML(['구간', '들어옴', '다음으로 감', '여기서 나감', '이탈률', '중앙값', '다음으로 간 사람 중앙값', '나간 사람 중앙값', '평균', '상위 10%'],
    rows.map(r => [segName(r, r.next), fmtN(r.entered), fmtN(r.moved_on), fmtN(r.exited), r.isFinal ? '완주' : pct(r.exited, r.entered) + '%', fmtDur(r.median_sec), fmtDur(r.median_moved_sec), fmtDur(r.median_exited_sec), fmtDur(r.avg_sec), fmtDur(r.p90_sec)]));
}

/* ---------- 플레이어 목록 ---------- */
const PV = { q:'', st:'all', sort:'last_seen', page:0 };
let PV_game = null;
async function viewPlayers(id) {
  if (PV_game !== id) { PV.q = ''; PV.st = 'all'; PV.page = 0; PV_game = id; }
  const g = GAME_BY_ID[id]; if (!g) { location.hash = 'overview'; return; }
  const r = range(state.days);
  setTitle(g.name + ' · 플레이어', rangeLabel(r) + ' 에 접속한 사람 · 기록은 처음 접속부터 전부');
  view.innerHTML = subtabs(g, 'players') + '<div class="empty">불러오는 중…</div>';
  const list = (await load(() => api().players(id, r))).map(p => ({ ...p, total_ms:Number(p.total_ms) || 0, sessions:Number(p.sessions), last_segment_ms:Number(p.last_segment_ms) || 0, status:statusOf(p, g) }));
  const cnt = { all:list.length, done:0, active:0, idle:0, gone:0 }; list.forEach(p => cnt[p.status]++);
  const tot = list.reduce((a, p) => a + p.total_ms, 0);
  const med = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length / 2; return s.length % 2 ? s[m | 0] : (s[m - 1] + s[m]) / 2; };
  view.innerHTML = subtabs(g, 'players', list.length) + `
    <div class="kpis">
      <div class="kpi"><div class="l">플레이어</div><div class="v">${fmtN(list.length)}</div><div class="d">완주 ${fmtN(cnt.done)} · 진행 중 ${fmtN(cnt.active)}</div></div>
      <div class="kpi"><div class="l">1인당 총 플레이 (중앙값)</div><div class="v">${fmtDur(med(list.map(p => p.total_ms)) / 1000)}</div><div class="d">합계 ${fmtN(Math.round(tot / 3600000 * 10) / 10)}시간</div></div>
      <div class="kpi"><div class="l">이탈 · 휴면</div><div class="v">${fmtN(cnt.gone + cnt.idle)}</div><div class="d">14일 넘게 안 옴 ${fmtN(cnt.gone)} · 3–14일 ${fmtN(cnt.idle)}</div></div>
      <div class="kpi"><div class="l">나가기 전 마지막 구간 (중앙값)</div><div class="v">${fmtDur(med(list.filter(p => p.status === 'gone' || p.status === 'idle').map(p => p.last_segment_ms)) / 1000)}</div><div class="d">이탈·휴면한 사람 기준</div></div>
    </div>
    <section class="card">
      <div class="filters">
        <input id="pq" placeholder="ID·테스터 검색" value="${esc(PV.q)}" aria-label="플레이어 ID 검색">
        ${['all', 'active', 'done', 'idle', 'gone'].map(k => `<button class="chip ${PV.st === k ? 'on' : ''}" data-st="${k}" title="${ST_HELP[k] || ''}">${k === 'all' ? '전체' : ST[k]}<span class="n">${fmtN(cnt[k])}</span></button>`).join('')}
        <span style="flex:1"></span>
        <select id="psort" aria-label="정렬">
          ${[['last_seen', '최근 방문순'], ['total_ms', '총 플레이 긴 순'], ['max_step', '많이 진행한 순'], ['sessions', '접속 많은 순'], ['last_segment_ms', '마지막 구간 오래 머문 순'], ['first_seen', '처음 온 순']].map(([k, l]) => `<option value="${k}" ${PV.sort === k ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="j-legend"><span><i style="background:var(--series-1)"></i>지나간 구간 (길이 = 그 구간에서 플레이한 시간)</span><span><i style="background:var(--series-2)"></i>여기서 나감</span><span><i style="background:repeating-linear-gradient(135deg,var(--series-1) 0 3px,transparent 3px 6px);border:1px solid var(--series-1)"></i>지금 하는 중</span><span><i style="background:var(--good)"></i>완주</span></div>
      <div id="ptable"></div>
    </section>`;
  const draw = () => {
    const q = PV.q.trim().toLowerCase();
    let rows = list.filter(p => (PV.st === 'all' || p.status === PV.st) && (!q || [p.visitor_id, p.tester_code, p.tester_name].some(x => String(x || '').toLowerCase().includes(q))));
    const k = PV.sort;
    rows.sort((a, b) => k === 'first_seen' ? Date.parse(a.first_seen) - Date.parse(b.first_seen) : k === 'last_seen' ? Date.parse(b.last_seen) - Date.parse(a.last_seen) : (Number(b[k] ?? -1) - Number(a[k] ?? -1)));
    const per = 50, pages = Math.max(1, Math.ceil(rows.length / per)); PV.page = Math.min(PV.page, pages - 1);
    const page = rows.slice(PV.page * per, PV.page * per + per);
    const maxT = Math.max(1, ...page.map(p => p.total_ms));
    $('#ptable').innerHTML = rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>플레이어</th><th style="text-align:left">테스터</th><th style="text-align:left">상태</th><th>첫 방문</th><th>마지막 방문</th><th>접속</th><th>총 플레이</th><th style="text-align:left">최종 지점</th><th>마지막 구간</th><th style="text-align:left;min-width:260px">여정</th></tr></thead><tbody>${
      page.map((p, i) => {
        const segs = p.segments || [], lk = lastKind(p.status);
        return `<tr class="click" data-id="${esc(p.visitor_id)}">
          <td class="l"><a class="pid" href="#player-${slug(g.id)}--${esc(p.visitor_id)}">${short(p.visitor_id)}</a></td>
          <td class="l">${p.tester_code ? `<a href="#tester-${esc(p.tester_code)}" style="color:inherit;text-decoration:none"><b style="font-weight:600">${esc(p.tester_name || '')}</b> <span class="num" style="color:var(--text-3);font-size:11.5px">${esc(p.tester_code)}</span></a>` : '<span style="color:var(--text-3)">–</span>'}</td>
          <td class="l">${stHTML(p.status)}</td>
          <td class="num">${fmtTime(p.first_seen)}</td><td class="num" title="${fmtTime(p.last_seen)}">${ago(p.last_seen)}</td>
          <td class="num">${fmtN(p.sessions)}</td><td class="num">${fmtDur(p.total_ms / 1000)}</td>
          <td class="l">${esc(p.last_milestone || '시작 전')}</td>
          <td class="num">${fmtDur(p.last_segment_ms / 1000)}</td>
          <td class="l"><div class="journey" style="width:${Math.max(6, p.total_ms / maxT * 100)}%" data-p="${PV.page * per + i}">${segs.map((sg, j) => `<span data-j="${j}" class="${j === segs.length - 1 ? lk : ''}" style="flex:${Math.max(Number(sg.ms), 1)} 1 0"></span>`).join('')}</div></td>
        </tr>`; }).join('')}</tbody></table></div>
      <div class="pager">${PV.page > 0 ? '<button class="btn" id="pprev">이전</button>' : ''}<span>${PV.page * per + 1}–${Math.min(rows.length, PV.page * per + per)} / ${fmtN(rows.length)}명</span>${PV.page < pages - 1 ? '<button class="btn" id="pnext">다음</button>' : ''}</div>`
      : '<div class="empty">조건에 맞는 플레이어가 없습니다.</div>';
    $('#ptable').querySelectorAll('tr.click').forEach(tr => tr.onclick = e => { if (e.target.closest('a')) return; location.hash = `player-${slug(g.id)}--${tr.dataset.id}`; });
    $('#ptable').querySelectorAll('.journey span').forEach(sp => {
      sp.onpointermove = e => {
        const p = rows[+sp.parentElement.dataset.p], segs = p.segments, j = +sp.dataset.j, sg = segs[j], last = j === segs.length - 1;
        showTip(e, segName(sg, segs[j + 1]), [{ c:last ? (p.status === 'done' ? css('--good') : p.status === 'active' ? css('--series-1') : css('--series-2')) : css('--series-1'), l:'머문 시간', v:fmtDur(sg.ms / 1000) },
          { l:'도착 시점 (누적)', v:fmtDur(sg.at_ms / 1000) }, { l:'', v:last ? (p.status === 'done' ? '완주' : p.status === 'active' ? '지금 여기 진행 중' : '여기서 나감') : '다음 지점으로 감' }]);
      };
      sp.onpointerleave = hideTip;
    });
    const pp = $('#pprev'), pn = $('#pnext');
    if (pp) pp.onclick = () => { PV.page--; draw(); }; if (pn) pn.onclick = () => { PV.page++; draw(); };
  };
  draw();
  $('#pq').oninput = e => { PV.q = e.target.value; PV.page = 0; draw(); };
  $('#psort').onchange = e => { PV.sort = e.target.value; PV.page = 0; draw(); };
  view.querySelectorAll('.chip').forEach(b => b.onclick = () => { PV.st = b.dataset.st; PV.page = 0; view.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); draw(); });
}

async function viewPlayer(id, vid) {
  const g = GAME_BY_ID[id]; if (!g) { location.hash = 'overview'; return; }
  const sl = slug(g.id);
  setTitle(`플레이어 ${short(vid)}`, `${esc(g.name)} · ID <span class="num">${esc(vid)}</span>`);
  view.innerHTML = '<div class="empty">불러오는 중…</div>';
  const [d, segAll] = await Promise.all([load(() => api().playerDetail(id, vid)), load(() => api().segments(id, range(state.days)))]);
  const ss = d.sessions || [], ms = d.milestones || [];
  if (!ss.length) { view.innerHTML = `<a class="back" href="#players-${sl}">← 플레이어 목록</a><div class="card"><div class="empty">이 플레이어 기록을 찾지 못했습니다.</div></div>`; return; }
  const total = Number(d.total_ms) || 0;
  // 구간 계산 (지점마다 첫 도달)
  const first = {}; ms.forEach(m => { if (!(m.step in first) || m.total_ms < first[m.step].t) first[m.step] = { step:m.step, name:m.name, t:Number(m.total_ms), at:m.at }; });
  const pts = [{ step:0, name:'접속', t:0, at:ss[0].started_at }, ...Object.values(first)].sort((a, b) => a.t - b.t || a.step - b.step);
  const segs = pts.map((p, i) => ({ ...p, ms:Math.max(0, (i < pts.length - 1 ? pts[i + 1].t : total) - p.t), next:pts[i + 1], exit:i === pts.length - 1 }));
  const maxStep = ms.length ? Math.max(...ms.map(m => m.step)) : null;
  const lastMs = ms.length ? [...ms].sort((a, b) => b.total_ms - a.total_ms)[0] : null;
  const lastSeen = ss.reduce((a, s) => s.last_seen_at > a ? s.last_seen_at : a, ss[0].last_seen_at);
  const st = statusOf({ max_step:maxStep, last_seen:lastSeen }, g), lk = lastKind(st);
  const medBy = Object.fromEntries((segAll || []).map(x => [x.step, Number(x.median_sec) * 1000]));
  const devs = [...new Set(ss.map(s => s.device).filter(Boolean))].map(x => ({ mobile:'모바일', desktop:'PC', tablet:'태블릿' })[x] || x).join(', ');
  const refs = [...new Set(ss.map(s => s.referrer).filter(Boolean))];
  const lastSeg = segs[segs.length - 1];
  const fin = finalOf(g);
  const longestSeg = segs.filter(x => !x.exit || st !== 'done').reduce((a, x) => x.ms > (a?.ms ?? -1) ? x : a, null);

  if (d.tester_code) setTitle(`${d.tester_name || '테스터'} · ${short(vid)}`, `${esc(g.name)} · 베타 테스터 <a class="num" href="#tester-${esc(d.tester_code)}">${esc(d.tester_code)}</a> · ID <span class="num">${esc(vid)}</span>`);
  view.innerHTML = `<a class="back" href="#players-${sl}">← ${esc(g.name)} 플레이어 목록</a>
    <div class="kpis">
      <div class="kpi"><div class="l">상태</div><div class="v" style="font-size:20px;font-family:var(--sans)">${stHTML(st)}</div><div class="d">${ST_HELP[st]} · ${devs || '기기 정보 없음'}</div></div>
      <div class="kpi"><div class="l">총 플레이</div><div class="v">${fmtDur(total / 1000)}</div><div class="d">접속 ${ss.length}회 · 1회 평균 ${fmtDur(total / ss.length / 1000)}</div></div>
      <div class="kpi"><div class="l">첫 방문 → 마지막 방문</div><div class="v" style="font-size:19px">${fmtTime(ss[0].started_at)}</div><div class="d">마지막 ${fmtTime(lastSeen)} (${ago(lastSeen)})</div></div>
      <div class="kpi"><div class="l">최종 도달 지점</div><div class="v" style="font-size:20px;font-family:var(--sans)">${esc(lastMs ? lastMs.name : '시작 전')}</div><div class="d">${maxStep != null ? `step ${maxStep} / 마지막 ${fin}` : '마일스톤 기록 없음'}</div></div>
      <div class="kpi"><div class="l">${st === 'done' ? '완주 후 더 플레이' : st === 'active' ? '지금 구간에서 플레이 중' : '나가기 전 마지막 구간'}</div><div class="v">${fmtDur(lastSeg.ms / 1000)}</div><div class="d">${esc(segName(lastSeg, null))}</div></div>
    </div>
    ${refs.length ? `<div class="banner"><span>↗</span><div>들어온 경로: ${refs.map(x => `<span class="num">${esc(x)}</span>`).join(', ')}</div></div>` : ''}
    <section class="card"><div class="card-h"><div style="flex:1"><h2>구간별로 머문 시간</h2><p>막대 = 이 사람이 그 구간에서 플레이한 시간 · 세로선 = 같은 기간 전체 플레이어 중앙값</p></div></div>
      <div class="j-legend"><span><i style="background:var(--series-1)"></i>지나간 구간</span><span><i style="background:${lk === 'exit' ? 'var(--series-2)' : lk === 'fin' ? 'var(--good)' : 'var(--series-1)'}"></i>${lk === 'exit' ? '여기서 나감' : lk === 'fin' ? '완주' : '지금 진행 중'}</span><span><i style="background:var(--text);opacity:.55;width:3px"></i>전체 중앙값</span></div>
      <div id="pseg"></div>
      <div class="insight">${longestSeg ? `가장 오래 머문 구간은 <b>${esc(segName(longestSeg, longestSeg.next))}</b> (${fmtDur(longestSeg.ms / 1000)})${medBy[longestSeg.step] ? `, 전체 중앙값의 <b>${(longestSeg.ms / medBy[longestSeg.step]).toFixed(1)}배</b>` : ''}입니다.` : ''}
      ${st === 'gone' || st === 'idle' ? ` <b>${esc(lastSeg.name)}</b>에 도착한 뒤 ${fmtDur(lastSeg.ms / 1000)} 플레이하고 ${ago(lastSeen)} 마지막으로 나갔습니다.` : ''}</div>
    </section>
    <section class="card"><div class="card-h"><div style="flex:1"><h2>접속 타임라인</h2><p>막대 길이 = 그 접속에서 실제 플레이한 시간 · 눈금 = 그때 밟은 마일스톤</p></div></div><div id="ptl"></div></section>
    <section class="card"><div class="card-h"><div style="flex:1"><h2>마일스톤 기록 전체</h2><p>시간순 · 같은 지점을 다시 밟은 기록도 모두 표시</p></div></div><div id="plog"></div></section>`;

  // 구간 막대
  const maxMs = Math.max(1, ...segs.map(x => Math.max(x.ms, medBy[x.step] || 0)));
  $('#pseg').innerHTML = segs.map((x, i) => {
    const med = medBy[x.step], ratio = med ? x.ms / med : null, cls = x.exit ? (lk === 'exit' ? 'exit' : lk === 'live' ? 'live' : '') : '';
    return `<div class="seg-row" data-i="${i}">
      <div class="nm" title="${esc(segName(x, x.next))}">${esc(x.name)}${x.next ? ' → ' + esc(x.next.name) : ''}<small>${x.exit ? (lk === 'exit' ? '여기서 나감' : lk === 'live' ? '지금 여기' : '완주 이후') : '도착 ' + fmtTime(x.at)}</small></div>
      <div class="seg-track"><div class="seg-bar ${cls}" style="width:${x.ms / maxMs * 100}%;${x.exit && lk === 'fin' ? 'background:var(--good)' : ''}"></div>${med ? `<div class="seg-med" style="left:${med / maxMs * 100}%"></div>` : ''}</div>
      <div class="seg-val">${fmtDur(x.ms / 1000)}<small>${ratio != null ? (ratio >= 1 ? `중앙값의 ${ratio.toFixed(1)}배` : `중앙값보다 ${Math.round((1 - ratio) * 100)}% 짧음`) : '비교 자료 없음'}</small></div>
    </div>`; }).join('');
  $('#pseg').querySelectorAll('.seg-row').forEach(el => {
    const x = segs[+el.dataset.i];
    el.onpointermove = e => showTip(e, segName(x, x.next), [{ c:css('--series-1'), l:'이 플레이어', v:fmtDur(x.ms / 1000) }, { l:'전체 중앙값', v:medBy[x.step] ? fmtDur(medBy[x.step] / 1000) : '–' }, { l:'도착 (누적 플레이)', v:fmtDur(x.t / 1000) }]);
    el.onpointerleave = hideTip;
  });

  // 타임라인
  const maxD = Math.max(1, ...ss.map(s => Number(s.dwell_ms) || 0));
  $('#ptl').innerHTML = ss.map((s, i) => {
    const sm = ms.filter(m => m.session_id === s.session_id), dw = Number(s.dwell_ms) || 0;
    const gap = i ? Date.parse(s.started_at) - Date.parse(ss[i - 1].last_seen_at) : 0;
    return `${i ? `<div class="gap">⋯ ${gapText(gap)} 다시 접속 ⋯</div>` : ''}<div class="sess">
      <div class="sess-h"><b>#${i + 1}</b> ${fmtTime(s.started_at)} <span>${({ mobile:'모바일', desktop:'PC', tablet:'태블릿' })[s.device] || ''}</span><span>플레이 ${fmtDur(dw / 1000)}</span>${sm.length ? `<span>마일스톤 ${sm.length}개</span>` : '<span>새 마일스톤 없음</span>'}${i === ss.length - 1 && (st === 'gone' || st === 'idle') ? '<span style="color:var(--series-2)">← 마지막 접속</span>' : ''}</div>
      <div class="sess-bar" style="width:${Math.max(4, dw / maxD * 100)}%"><div class="sess-fill" style="width:100%"></div>${sm.map((m, j) => `<span class="sess-tick" data-s="${i}" data-m="${j}" style="left:${dw ? Math.min(100, m.elapsed_ms / dw * 100) : 0}%"></span>`).join('')}</div>
      ${sm.length ? `<div class="chips">${sm.map(m => `<span class="mchip"><b>${esc(m.name)}</b><small>+${fmtDur(m.elapsed_ms / 1000)}</small></span>`).join('')}</div>` : ''}
    </div>`; }).join('');
  $('#ptl').querySelectorAll('.sess-tick').forEach(t => {
    const s = ss[+t.dataset.s], m = ms.filter(x => x.session_id === s.session_id)[+t.dataset.m];
    t.onpointermove = e => showTip(e, m.name, [{ l:'이번 접속 후', v:fmtDur(m.elapsed_ms / 1000) }, { l:'누적 플레이', v:fmtDur(m.total_ms / 1000) }, { l:'시각', v:fmtTime(m.at) }]);
    t.onpointerleave = hideTip;
  });

  // 로그
  const sNo = Object.fromEntries(ss.map((s, i) => [s.session_id, i + 1]));
  let prevT = 0;
  $('#plog').innerHTML = ms.length ? `<div class="tbl-wrap"><table><thead><tr><th>시각</th><th>접속</th><th style="text-align:left">지점</th><th>step</th><th>접속 후 경과</th><th>누적 플레이</th><th>앞 기록부터</th></tr></thead><tbody>${
    ms.map(m => { const dlt = Number(m.total_ms) - prevT; prevT = Number(m.total_ms);
      return `<tr><td class="l num">${fmtTime(m.at)}</td><td class="num">#${sNo[m.session_id] || '–'}</td><td class="l">${esc(m.name)}</td><td class="num">${m.step}</td><td class="num">${fmtDur(m.elapsed_ms / 1000)}</td><td class="num">${fmtDur(m.total_ms / 1000)}</td><td class="num">${fmtDur(dlt / 1000)}</td></tr>`; }).join('')
  }</tbody></table></div>` : '<div class="empty">마일스톤 기록이 없습니다. 첫 지점에 가기 전에 나갔습니다.</div>';
}

/* =====================================================================
   베타 테스터

function toastMsg(t, bad) {
  const el = document.createElement('div');
  el.textContent = t;
  el.style.cssText = `position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:${bad ? 'var(--bad)' : 'var(--accent)'};color:var(--surface);padding:9px 16px;border-radius:99px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.2);transition:opacity .3s`;
  document.body.appendChild(el);
  setTimeout(() => el.style.opacity = '0', 1600); setTimeout(() => el.remove(), 2000);
}
async function copyText(t, what) {
  try { await navigator.clipboard.writeText(t); toastMsg((what || '') + ' 복사했습니다'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toastMsg((what || '') + ' 복사했습니다'); } catch (x) { toastMsg('복사하지 못했습니다. 직접 선택해서 복사하세요', true); }
    ta.remove();
  }
}
const SHORT_NAME = { waiting:'웨이팅', flip_it_all:'다 세워버려', seller_of_the_border:'국경의 장사꾼', disaster_hero:'재앙의 용사', highrise_cleaner:'고층 세척', jurassic_brawl:'쥬라기', my_pet_hero:'개는 영웅', planet_battle:'행성 공방' };
function inviteText(t) {
  return `[베타 테스트 안내]\n${t.name}님의 참가 코드: ${t.code}\n\n게임을 처음 열 때 이 코드를 한 번 입력하면 됩니다. (게임마다 1번씩)\n\n` +
    GAMES.filter(g => g.url).map(g => `· ${g.name}\n  ${g.url}`).join('\n') + `\n\n코드는 본인만 사용해 주세요.`;
}
function heat(ms) {   // 플레이 시간 → 단계 (한 가지 색, 진할수록 오래)
  if (!ms) return '';
  const m = ms / 60000, lv = m < 5 ? 18 : m < 20 ? 38 : m < 60 ? 62 : 88;
  return `background:color-mix(in srgb,var(--series-1) ${lv}%,transparent);${lv > 50 ? 'color:#fff' : ''}`;
}
const TV = { q:'', sort:'created', st:'all' };

        <td class="l"><button class="tbtn ${t.active ? '' : 'off'}" data-toggle="${esc(t.code)}">${t.active ? '사용 중' : '중지됨'}</button></td>
        ${webGames.map(g => { const x = t.gmap[g.id];
          return `<td class="cell">${x ? `<a class="c" href="#player-${slug(g.id)}--${esc((x.visitors || [])[0] || '')}" style="${heat(Number(x.total_ms))};text-decoration:none" data-g="${g.id}" data-code="${esc(t.code)}">${fmtDur(Number(x.total_ms) / 1000, true)}</a>` : '<span class="c z">–</span>'}</td>`; }).join('')}
        <td class="num">${t.total_ms ? fmtDur(t.total_ms / 1000) : '–'}</td>
        <td class="num" ${t.last_seen ? `title="${fmtTime(t.last_seen)}"` : ''}>${t.last_seen ? ago(t.last_seen) : '<span style="color:var(--text-3)">아직 없음</span>'}</td>
        <td><a class="tag-t" href="#tester-${esc(t.code)}">상세</a> <button class="tbtn" data-invite="${esc(t.code)}" title="개인 안내문 복사">안내문</button></td>
      </tr>`).join('')}</tbody></table></div>` : '<div class="empty">조건에 맞는 테스터가 없습니다.</div>';
    const box = $('#tmx');
    box.querySelectorAll('[data-copy]').forEach(el => el.onclick = () => copyText(el.dataset.copy, '코드를'));
    box.querySelectorAll('[data-invite]').forEach(el => el.onclick = () => copyText(inviteText(T.find(t => t.code === el.dataset.invite)), '안내문을'));
    box.querySelectorAll('[data-toggle]').forEach(el => el.onclick = async () => {
      const t = T.find(x => x.code === el.dataset.toggle);
      try { await api().updateTester(t.code, { active:!t.active }); t.active = !t.active; draw(); toastMsg(`${t.name} ${t.active ? '다시 사용' : '중지'}`); }
      catch (e) { toastMsg('바꾸지 못했습니다: ' + e.message, true); }
    });
    box.querySelectorAll('td.nm input').forEach(inp => {
      inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
      inp.onchange = async () => {
        const t = T.find(x => x.code === inp.dataset.code), v = inp.value.trim().slice(0, 60);
        if (!v) { inp.value = t.name; return; }
        try { await api().updateTester(t.code, { name:v }); t.name = v; toastMsg('이름을 저장했습니다'); }
        catch (e) { inp.value = t.name; toastMsg('저장하지 못했습니다: ' + e.message, true); }
      };
    });
    box.querySelectorAll('a.c').forEach(a => {
      const t = T.find(x => x.code === a.dataset.code), x = t.gmap[a.dataset.g];
      a.onpointermove = e => showTip(e, `${t.name} · ${GAME_BY_ID[a.dataset.g].name}`, [{ c:css('--series-1'), l:'플레이', v:fmtDur(Number(x.total_ms) / 1000) }, { l:'접속', v:fmtN(x.sessions) + '회' }, { l:'최종 지점', v:x.last_milestone || '시작 전' }, { l:'마지막', v:fmtTime(x.last_at) }, ...(Number(x.devices) > 1 ? [{ l:'기기', v:x.devices + '대' }] : [])]);
      a.onpointerleave = hideTip;
    });
  };
  draw();
  $('#tq').oninput = e => { TV.q = e.target.value; draw(); };
  $('#tsort').onchange = e => { TV.sort = e.target.value; draw(); };
  view.querySelectorAll('.chip').forEach(b => b.onclick = () => { TV.st = b.dataset.st; view.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  $('#copyAll').onclick = () => copyText('이름\t코드\t메모\n' + T.map(t => `${t.name}\t${t.code}\t${t.memo || ''}`).join('\n'), `${T.length}명 이름·코드를`);
  $('#addBtn').onclick = async () => {
    const lines = $('#addNames').value.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) { $('#addMsg').textContent = '이름을 한 줄에 하나씩 넣어주세요.'; return; }
    if (lines.length > 200) { $('#addMsg').textContent = '한 번에 200명까지 만들 수 있습니다.'; return; }
    const rows = lines.map(l => { const i = l.indexOf(','); return { code:makeCode(), name:(i < 0 ? l : l.slice(0, i)).trim().slice(0, 60), memo:i < 0 ? null : l.slice(i + 1).trim().slice(0, 300) || null }; });
    $('#addBtn').disabled = true; $('#addMsg').textContent = '만드는 중…';
    try {
      try { await api().createTesters(rows); }
      catch (e) { if (!/409|duplicate/i.test(e.message)) throw e; rows.forEach(r => r.code = makeCode()); await api().createTesters(rows); }
      toastMsg(`${rows.length}명 코드를 만들었습니다`); viewTesters();
    } catch (e) { $('#addBtn').disabled = false; $('#addMsg').textContent = '실패: ' + e.message; }
  };
}

async function viewTester(code) {
  view.innerHTML = '<div class="empty">불러오는 중…</div>';
  $('#range').style.visibility = 'hidden';
  const list = await load(() => api().testers());
  state.testerCount = list.length; renderNav();
  const t = list.find(x => x.code === code);
  if (!t) { setTitle('베타 테스터', ''); view.innerHTML = '<a class="back" href="#testers">← 테스터 목록</a><div class="card"><div class="empty">없는 코드입니다.</div></div>'; return; }
  const gm = Object.fromEntries((t.games || []).map(x => [x.game_id, x]));
  const total = Number(t.total_ms) || 0;
  setTitle(t.name, `베타 테스터 · 코드 <span class="num">${esc(t.code)}</span> · ${t.active ? '사용 중' : '<span style="color:var(--bad)">중지됨</span>'} · 만든 날 ${fmtTime(t.created_at)}`);
  view.innerHTML = `<a class="back" href="#testers">← 테스터 목록</a>
    <div class="kpis">
      <div class="kpi"><div class="l">해본 게임</div><div class="v">${t.games.length}<small>/8</small></div><div class="d">${t.games.map(x => SHORT_NAME[x.game_id]).join(', ') || '아직 없음'}</div></div>
      <div class="kpi"><div class="l">총 플레이</div><div class="v">${total ? fmtDur(total / 1000) : '–'}</div><div class="d">접속 ${fmtN(t.games.reduce((a, x) => a + Number(x.sessions), 0))}회</div></div>
      <div class="kpi"><div class="l">게임 입장</div><div class="v">${fmtN(t.ok_entries)}<small>회</small></div><div class="d">틀린·중지 상태 시도 ${fmtN(t.failed_entries)}회</div></div>
      <div class="kpi"><div class="l">마지막 접속</div><div class="v" style="font-size:19px">${t.last_seen ? fmtTime(t.last_seen) : '–'}</div><div class="d">${t.last_seen ? ago(t.last_seen) : '아직 들어온 적 없음'}</div></div>
    </div>
    <section class="card"><div class="card-h"><div style="flex:1"><h2>게임별 기록</h2><p>게임 이름을 누르면 그 게임 안에서의 구간·접속 기록 전체를 볼 수 있습니다</p></div></div>
      <div class="tbl-wrap"><table><thead><tr><th>게임</th><th>플레이</th><th>접속</th><th style="text-align:left">최종 지점</th><th style="text-align:left">상태</th><th>처음</th><th>마지막</th><th>기기</th></tr></thead><tbody>${
      GAMES.map(g => { const x = gm[g.id];
        if (!x) return `<tr><td class="l" style="color:var(--text-3)">${esc(g.name)}</td><td colspan="7" class="l" style="color:var(--text-3)">${g.url ? '아직 안 해봄' : '웹 버전 없음'}</td></tr>`;
        const st = statusOf({ max_step:x.max_step, last_seen:x.last_at }, g);
        return `<tr><td class="l"><a href="#player-${slug(g.id)}--${esc((x.visitors || [])[0] || '')}">${esc(g.name)}</a></td><td class="num">${fmtDur(Number(x.total_ms) / 1000)}</td><td class="num">${fmtN(x.sessions)}</td><td class="l">${esc(x.last_milestone || '시작 전')}</td><td class="l">${stHTML(st)}</td><td class="num">${fmtTime(x.first_at)}</td><td class="num">${ago(x.last_at)}</td><td class="num">${(x.visitors || []).length > 1 ? (x.visitors || []).map((v, i) => `<a class="pid" href="#player-${slug(g.id)}--${esc(v)}">${i + 1}</a>`).join(' ') : '1'}</td></tr>`; }).join('')
      }</tbody></table></div></section>
    <div class="grid2">
      <section class="card"><div class="card-h"><h2 style="flex:1">정보 고치기</h2></div>
        <div class="field"><label for="tn">이름</label><input id="tn" value="${esc(t.name)}" maxlength="60" style="width:100%;border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:8px 10px"></div>
        <div class="field"><label for="tm">메모</label><input id="tm" value="${esc(t.memo || '')}" maxlength="300" style="width:100%;border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:8px 10px"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="tsave">저장</button><button class="btn" id="tact">${t.active ? '코드 사용 중지' : '다시 사용'}</button><span style="flex:1"></span><button class="btn" id="tdel" style="color:var(--bad)">삭제</button></div>
      </section>
      <section class="card"><div class="card-h"><div style="flex:1"><h2>개인 안내문</h2><p>메신저로 그대로 보내면 됩니다</p></div><button class="btn" id="tinv">복사</button></div>
        <pre style="white-space:pre-wrap">${esc(inviteText(t))}</pre></section>
    </div>`;
  $('#tinv').onclick = () => copyText(inviteText(t), '안내문을');
  $('#tsave').onclick = async () => {
    const name = $('#tn').value.trim().slice(0, 60), memo = $('#tm').value.trim().slice(0, 300) || null;
    if (!name) return toastMsg('이름을 넣어주세요', true);
    try { await api().updateTester(code, { name, memo }); toastMsg('저장했습니다'); viewTester(code); } catch (e) { toastMsg('저장 실패: ' + e.message, true); }
  };
  $('#tact').onclick = async () => { try { await api().updateTester(code, { active:!t.active }); toastMsg(t.active ? '중지했습니다. 다음 접속부터 막힙니다' : '다시 사용할 수 있습니다'); viewTester(code); } catch (e) { toastMsg('실패: ' + e.message, true); } };
  let armed = false;
  $('#tdel').onclick = async () => {
    if (!armed) { armed = true; $('#tdel').textContent = '정말 삭제 (기록은 남음)'; setTimeout(() => { armed = false; const b = $('#tdel'); if (b) b.textContent = '삭제'; }, 4000); return; }
    try { await api().deleteTester(code); toastMsg('삭제했습니다'); location.hash = 'testers'; } catch (e) { toastMsg('삭제 실패: ' + e.message, true); }
  };
}

/* =====================================================================
   라우팅
   ===================================================================== */
let renderSeq = 0;
async function route() {
  const seq = ++renderSeq;
  const h = location.hash.slice(1) || 'overview';
  renderNav(); renderConn(); hideTip();
  $('#side').classList.remove('open');
  $('#range').style.visibility = h === 'guide' || h === 'testers' || h.startsWith('tester-') ? 'hidden' : '';
  try {
    if (h === 'guide') viewGuide();
    else if (h.startsWith('game-')) await viewGame(unslug(h.slice(5)));
    else if (h === 'testers') await viewTesters();
    else if (h.startsWith('tester-')) await viewTester(h.slice(7));
    else if (h.startsWith('players-')) await viewPlayers(unslug(h.slice(8)));
    else if (h.startsWith('player-') && h.includes('--')) { const [gs, v] = h.slice(7).split('--'); await viewPlayer(unslug(gs), v); }
    else await viewOverview();
  } catch (e) {
    if (seq === renderSeq) view.innerHTML = `<div class="card"><div class="empty">데이터를 불러오지 못했습니다.<br>${esc(state.liveError || e.message)}<br><br><button class="btn" onclick="openModal()">연결 설정 열기</button> <button class="btn" onclick="useDemo()">데모 데이터로 보기</button></div></div>`;
    console.error(e);
  }
}
addEventListener('hashchange', route);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(route, 250); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', route);

document.querySelectorAll('#range button').forEach(b => {
  b.classList.toggle('on', +b.dataset.d === state.days);
  b.onclick = () => { state.days = +b.dataset.d; LS.set('ga_days', state.days); state.overviewCache = null; document.querySelectorAll('#range button').forEach(x => x.classList.toggle('on', x === b)); route(); };
});
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');

/* =====================================================================
   연결 모달
   ===================================================================== */
const modal = $('#modalBg'), msg = $('#mMsg');
function openModal() {
  $('#fUrl').value = state.cfg.url || ''; $('#fKey').value = state.cfg.key || '';
  $('#fEmail').value = state.auth?.email || ''; $('#fPw').value = '';
  msg.textContent = state.mode === 'live' && state.auth ? `${state.auth.email} 로 연결됨` : ''; msg.className = 'msg ok';
  modal.classList.add('show'); $('#fUrl').focus();
}
function useDemo() { state.mode = 'demo'; state.liveError = null; state.overviewCache = null; modal.classList.remove('show'); route(); }
window.openModal = openModal; window.useDemo = useDemo;
$('#connPill').onclick = openModal;
$('#mClose').onclick = () => modal.classList.remove('show');
modal.onclick = e => { if (e.target === modal) modal.classList.remove('show'); };
addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('show'); });
$('#mDemo').onclick = useDemo;
$('#mLogout').onclick = () => { state.auth = null; LS.del('ga_auth'); useDemo(); };
$('#mLogin').onclick = async () => {
  const url = $('#fUrl').value.trim().replace(/\/+$/, ''), key = $('#fKey').value.trim(), email = $('#fEmail').value.trim(), pw = $('#fPw').value;
  if (!/^https:\/\/.+/.test(url) || !key) { msg.className = 'msg err'; msg.textContent = 'Project URL 과 키를 확인하세요.'; return; }
  state.cfg = { url, key }; LS.set('ga_cfg', state.cfg);
  if (!email || !pw) {
    if (state.auth) { state.mode = 'live'; state.overviewCache = null; modal.classList.remove('show'); route(); return; }
    msg.className = 'msg err'; msg.textContent = '이메일과 비밀번호를 넣으세요. (주소와 키는 저장했습니다)'; return;
  }
  msg.className = 'msg'; msg.textContent = '로그인 중…';
  try {
    state.auth = await Live.login(url, key, email, pw); LS.set('ga_auth', state.auth);
    state.mode = 'live';
    const ok = await Live.isAdmin();
    if (!ok) { msg.className = 'msg err'; msg.textContent = '로그인은 됐지만 관리자 등록이 안 되어 있습니다. 가이드 3단계의 SQL 을 실행하세요.'; return; }
    msg.className = 'msg ok'; msg.textContent = '연결됐습니다.';
    state.liveError = null; state.overviewCache = null;
    setTimeout(() => { modal.classList.remove('show'); route(); }, 400);
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = e instanceof TypeError ? '서버에 닿지 못했습니다. 주소를 확인하세요. (claude.ai 미리보기 안에서는 외부 연결이 막혀 있습니다 — GitHub Pages 에 올린 대시보드에서 연결하세요)' : e.message;
  }
};

route();
</script>
</body>
</html>
